# Move to .github/workflows/ci.yml after Phase 00 initializes package.json.
# Codex must verify current action versions before activation.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack
        run: corepack enable

      - name: Verify specification pack
        run: |
          node scripts/check-spec-coverage.mjs
          node scripts/verify-pack.mjs

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint, typecheck, unit/integration tests, and build
        run: pnpm verify

  browser:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    needs: quality
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Enable Corepack and install
        run: |
          corepack enable
          pnpm install --frozen-lockfile

      - name: Install Playwright Chromium
        run: pnpm exec playwright install --with-deps chromium

      - name: Run browser tests
        run: pnpm test:e2e

      - name: Upload Playwright report on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-report
          path: playwright-report/
          if-no-files-found: ignore
          retention-days: 7

  # Add a local-Supabase/RLS job once supabase/config.toml and database tests exist.
  # Add secret/dependency/migration scans in Phase 09. Never put provider secrets
  # in workflow YAML; use environment-scoped repository secrets with least privilege.
