openapi: 3.1.0
info:
  title: Student OS Internal API
  version: 0.1.0
  description: >-
    Next.js server contracts for Student OS. Bank providers are read-only;
    this API never initiates bank transfers or brokerage trades.
servers:
  - url: http://localhost:3000
security:
  - cookieAuth: []
tags:
  - name: Dashboard
  - name: Tutoring
  - name: Money
  - name: Subscriptions
  - name: Household
  - name: Grow
  - name: Integrations
paths:
  /api/dashboard:
    get:
      tags: [Dashboard]
      operationId: getDashboard
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Unified dashboard with settled cash and economic metrics kept distinct.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Dashboard' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /api/students:
    get:
      tags: [Tutoring]
      operationId: listStudents
      responses:
        '200':
          description: Owned students
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Student' }
    post:
      tags: [Tutoring]
      operationId: createStudent
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/StudentInput' }
      responses:
        '201':
          description: Created
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Student' }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/lessons:
    get:
      tags: [Tutoring]
      operationId: listLessons
      parameters:
        - { in: query, name: from, schema: { type: string, format: date } }
        - { in: query, name: to, schema: { type: string, format: date } }
        - { in: query, name: status, schema: { $ref: '#/components/schemas/LessonStatus' } }
      responses:
        '200':
          description: Lessons
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Lesson' }
    post:
      tags: [Tutoring]
      operationId: createLesson
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/LessonInput' }
      responses:
        '201':
          description: Created lesson
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Lesson' }

  /api/lessons/{lessonId}/complete:
    post:
      tags: [Tutoring]
      operationId: completeLesson
      description: Idempotently completes a non-cancelled lesson and returns its one receivable.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Lesson and exactly one receivable
          content:
            application/json:
              schema:
                type: object
                required: [lesson, receivable]
                properties:
                  lesson: { $ref: '#/components/schemas/Lesson' }
                  receivable: { $ref: '#/components/schemas/Receivable' }
        '409': { description: Cancelled lesson cannot be completed }

  /api/lessons/{lessonId}/calendar-sync:
    post:
      tags: [Tutoring, Integrations]
      operationId: syncLessonCalendarEvent
      description: >-
        Creates or updates the app-owned event idempotently. A Google-generated
        meeting uses a fresh conference createRequest for this lesson only.
      parameters:
        - $ref: '#/components/parameters/LessonId'
      responses:
        '200':
          description: Event metadata and lesson-specific Meet URL
        '409': { description: Google disconnected or lesson mode is not online }

  /api/receivables/{receivableId}/allocations:
    post:
      tags: [Tutoring, Money]
      operationId: allocateReceivablePayment
      parameters:
        - { in: path, name: receivableId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [transactionId, amount]
              properties:
                transactionId: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/PositiveKrwAmount' }
      responses:
        '200':
          description: Updated receivable balance
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Receivable' }
        '409': { description: Allocation exceeds remaining amount or transaction is invalid }

  /api/accounts:
    get:
      tags: [Money]
      operationId: listAccounts
      description: Returns signed-in user's private accounts only.
      responses:
        '200':
          description: Account list
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Account' }

  /api/accounts/{accountId}/sync:
    post:
      tags: [Money, Integrations]
      operationId: syncAccount
      parameters:
        - { in: path, name: accountId, required: true, schema: { type: string, format: uuid } }
      responses:
        '202':
          description: Read-only sync accepted
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SyncRun' }
        '409': { description: Provider disabled, stale credentials, or sync already running }

  /api/transactions:
    get:
      tags: [Money]
      operationId: listTransactions
      parameters:
        - $ref: '#/components/parameters/Month'
        - { in: query, name: accountId, schema: { type: string, format: uuid } }
        - { in: query, name: kind, schema: { type: string, enum: [income, expense, transfer] } }
      responses:
        '200': { description: Owner-only ledger rows }
    post:
      tags: [Money]
      operationId: createManualTransaction
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/TransactionInput' }
      responses:
        '201': { description: Created actual ledger transaction }

  /api/transfers:
    post:
      tags: [Money, Grow]
      operationId: recordInternalTransfer
      description: Records two linked transfer legs; it does not move bank money.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [fromAccountId, toAccountId, amount, occurredAt]
              properties:
                fromAccountId: { type: string, format: uuid }
                toAccountId: { type: string, format: uuid }
                amount: { $ref: '#/components/schemas/PositiveKrwAmount' }
                occurredAt: { type: string, format: date-time }
                memo: { type: [string, 'null'] }
      responses:
        '201': { description: Transfer group and two legs }

  /api/transactions/import/preview:
    post:
      tags: [Money]
      operationId: previewTransactionImport
      description: Parses without committing; validates columns and neutralizes spreadsheet formula injection.
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [accountId, file]
              properties:
                accountId: { type: string, format: uuid }
                file: { type: string, format: binary }
      responses:
        '200': { description: Valid rows, duplicate flags, warnings and errors }

  /api/transactions/import/commit:
    post:
      tags: [Money]
      operationId: commitTransactionImport
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [previewToken]
              properties:
                previewToken: { type: string }
      responses:
        '201': { description: Idempotent commit summary }

  /api/matches:
    get:
      tags: [Money]
      operationId: listMatchSuggestions
      responses:
        '200': { description: Reviewable suggestions with amount/name/date evidence }

  /api/matches/{matchId}/confirm:
    post:
      tags: [Money]
      operationId: confirmMatch
      parameters:
        - { in: path, name: matchId, required: true, schema: { type: string, format: uuid } }
      responses:
        '200': { description: Committed link and audit event }
        '409': { description: Already matched, superseded, or invalid amount }

  /api/subscriptions:
    get:
      tags: [Subscriptions]
      operationId: listSubscriptions
      responses:
        '200': { description: Personal plus visible household subscriptions }
    post:
      tags: [Subscriptions]
      operationId: createSubscription
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SubscriptionInput' }
      responses:
        '201': { description: Created subscription and initial price history }

  /api/subscriptions/summary:
    get:
      tags: [Subscriptions]
      operationId: getSubscriptionSummary
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Monthly equivalent, annual projection, 7/30-day, trial and unmatched totals

  /api/subscriptions/{subscriptionId}/occurrences/generate:
    post:
      tags: [Subscriptions]
      operationId: generateSubscriptionOccurrences
      parameters:
        - { in: path, name: subscriptionId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              properties:
                through: { type: string, format: date }
      responses:
        '200': { description: Idempotently generated occurrences and any one-to-one household bridges }

  /api/households/{householdId}/inventory:
    get:
      tags: [Household]
      operationId: listInventory
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200': { description: Inventory grouped by storage and ownership }
    post:
      tags: [Household]
      operationId: createInventoryItem
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/InventoryItemInput' }
      responses:
        '201': { description: Created }

  /api/households/{householdId}/inventory/{itemId}/adjust:
    post:
      tags: [Household]
      operationId: adjustInventory
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - { in: path, name: itemId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required: [delta]
              properties:
                delta: { type: number }
                addToShoppingWhenLow: { type: boolean, default: false }
      responses:
        '200': { description: Updated quantity and optional deduplicated shopping item }

  /api/households/{householdId}/shopping:
    get:
      tags: [Household]
      operationId: listShopping
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200': { description: Needed/purchased/dismissed shopping items }

  /api/households/{householdId}/cleaning:
    get:
      tags: [Household]
      operationId: listCleaningTasks
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      responses:
        '200': { description: Tasks with derived ok/due-soon/due state }

  /api/households/{householdId}/cleaning/{taskId}/complete:
    post:
      tags: [Household]
      operationId: completeCleaningTask
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - { in: path, name: taskId, required: true, schema: { type: string, format: uuid } }
      requestBody:
        content:
          application/json:
            schema:
              type: object
              required: [completedByMemberId]
              properties:
                completedByMemberId: { type: string, format: uuid }
                note: { type: [string, 'null'] }
      responses:
        '200': { description: Completion history row and advanced next-due date }

  /api/households/{householdId}/shared-expenses:
    get:
      tags: [Household, Money]
      operationId: listSharedExpenses
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/Month'
      responses:
        '200': { description: Shared expenses visible to active members }
    post:
      tags: [Household, Money]
      operationId: createSharedExpense
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SharedExpenseInput' }
      responses:
        '201': { description: Expense whose splits allocate every KRW }
        '422': { $ref: '#/components/responses/ValidationError' }

  /api/households/{householdId}/settlement/summary:
    get:
      tags: [Household, Money]
      operationId: getSettlementSummary
      parameters:
        - $ref: '#/components/parameters/HouseholdId'
        - $ref: '#/components/parameters/Month'
      responses:
        '200': { description: Net member balances, source rows and open settlements }

  /api/grow/summary:
    get:
      tags: [Grow]
      operationId: getGrowSummary
      parameters:
        - $ref: '#/components/parameters/Month'
      responses:
        '200':
          description: Cash remaining, economic surplus, reserve gap, planned contribution and flexible money

  /api/integrations/google/connect:
    post:
      tags: [Integrations]
      operationId: startGoogleCalendarOAuth
      responses:
        '200': { description: Authorization URL with signed state }

  /api/integrations/google/callback:
    get:
      tags: [Integrations]
      operationId: googleCalendarOAuthCallback
      parameters:
        - { in: query, name: code, required: true, schema: { type: string } }
        - { in: query, name: state, required: true, schema: { type: string } }
      responses:
        '302': { description: Redirect; provider tokens remain server-side }

components:
  securitySchemes:
    cookieAuth:
      type: apiKey
      in: cookie
      name: sb-access-token
  parameters:
    Month:
      in: query
      name: month
      schema: { type: string, pattern: '^\\d{4}-\\d{2}$' }
      description: Asia/Seoul calendar month
    LessonId:
      in: path
      name: lessonId
      required: true
      schema: { type: string, format: uuid }
    HouseholdId:
      in: path
      name: householdId
      required: true
      schema: { type: string, format: uuid }
  responses:
    Unauthorized:
      description: Sign-in required
    ValidationError:
      description: Validation failed
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
  schemas:
    KrwAmount:
      type: integer
      format: int64
      minimum: 0
      description: Integer KRW, safely encoded across bigint/JSON boundaries.
    PositiveKrwAmount:
      type: integer
      format: int64
      minimum: 1
    Error:
      type: object
      required: [code, message]
      properties:
        code: { type: string }
        message: { type: string }
        fieldErrors:
          type: object
          additionalProperties:
            type: array
            items: { type: string }
    StudentType:
      type: string
      enum: [subject, school_record]
    Subject:
      type: [string, 'null']
      enum: [math, physics, chemistry, null]
    LessonMode:
      type: string
      enum: [online, in_person]
    LessonStatus:
      type: string
      enum: [scheduled, completed, cancelled]
    StudentInput:
      type: object
      required: [name, tutoringType, defaultMode, defaultFeeAmount, defaultDurationMinutes]
      properties:
        name: { type: string, minLength: 1 }
        tutoringType: { $ref: '#/components/schemas/StudentType' }
        subject: { $ref: '#/components/schemas/Subject' }
        defaultMode: { $ref: '#/components/schemas/LessonMode' }
        defaultFeeAmount: { $ref: '#/components/schemas/PositiveKrwAmount' }
        defaultDurationMinutes: { type: integer, minimum: 15, maximum: 600 }
        defaultLocation: { type: [string, 'null'] }
        meetStrategy: { type: string, enum: [google_generated, manual_reusable, none] }
        manualMeetUrl: { type: [string, 'null'], format: uri }
        payerAliases: { type: array, items: { type: string } }
      allOf:
        - if:
            properties: { tutoringType: { const: school_record } }
          then:
            properties: { subject: { type: 'null' } }
        - if:
            properties: { tutoringType: { const: subject } }
          then:
            required: [subject]
    Student:
      allOf:
        - $ref: '#/components/schemas/StudentInput'
        - type: object
          required: [id, active]
          properties:
            id: { type: string, format: uuid }
            active: { type: boolean }
    LessonInput:
      type: object
      required: [studentId, startsAt, endsAt, mode, amount]
      properties:
        studentId: { type: string, format: uuid }
        startsAt: { type: string, format: date-time }
        endsAt: { type: string, format: date-time }
        mode: { $ref: '#/components/schemas/LessonMode' }
        amount: { $ref: '#/components/schemas/PositiveKrwAmount' }
        prepNotes: { type: [string, 'null'] }
        prepItems: { type: array, items: { type: string } }
        inPersonLocation: { type: [string, 'null'] }
        meetStrategy: { type: string, enum: [google_generated, manual_reusable, none] }
    Lesson:
      allOf:
        - $ref: '#/components/schemas/LessonInput'
        - type: object
          required: [id, status]
          properties:
            id: { type: string, format: uuid }
            status: { $ref: '#/components/schemas/LessonStatus' }
            meetUrl: { type: [string, 'null'], format: uri }
            googleCalendarEventId: { type: [string, 'null'] }
    Receivable:
      type: object
      required: [id, lessonId, amountDue, amountPaid, amountRemaining, status]
      properties:
        id: { type: string, format: uuid }
        lessonId: { type: string, format: uuid }
        amountDue: { $ref: '#/components/schemas/PositiveKrwAmount' }
        amountPaid: { $ref: '#/components/schemas/KrwAmount' }
        amountRemaining: { $ref: '#/components/schemas/KrwAmount' }
        status: { type: string, enum: [open, partially_paid, paid, void] }
    Account:
      type: object
      required: [id, institutionName, nickname, accountType, currentBalance, provider, stale]
      properties:
        id: { type: string, format: uuid }
        institutionName: { type: string }
        nickname: { type: string }
        accountType: { type: string, enum: [checking, savings, cash, investment, other] }
        maskedAccountNumber: { type: [string, 'null'] }
        currentBalance: { type: integer, format: int64 }
        availableBalance:
          anyOf:
            - { type: integer, format: int64 }
            - { type: 'null' }
        provider: { type: string, enum: [mock, manual_csv, kftc_testbed, kftc_production] }
        lastSyncSuccessAt: { type: [string, 'null'], format: date-time }
        stale: { type: boolean }
    SyncRun:
      type: object
      required: [id, status, startedAt]
      properties:
        id: { type: string, format: uuid }
        status: { type: string, enum: [running, succeeded, failed, partial] }
        startedAt: { type: string, format: date-time }
        finishedAt: { type: [string, 'null'], format: date-time }
        importedCount: { type: integer }
        skippedCount: { type: integer }
        redactedError: { type: [string, 'null'] }
    TransactionInput:
      type: object
      required: [accountId, scope, direction, kind, amount, occurredAt]
      properties:
        accountId: { type: string, format: uuid }
        scope: { type: string, enum: [private, household] }
        householdId: { type: [string, 'null'], format: uuid }
        direction: { type: string, enum: [inflow, outflow] }
        kind: { type: string, enum: [income, expense, transfer] }
        amount: { $ref: '#/components/schemas/PositiveKrwAmount' }
        occurredAt: { type: string, format: date-time }
        categoryId: { type: [string, 'null'], format: uuid }
        counterparty: { type: [string, 'null'] }
        descriptor: { type: [string, 'null'] }
        memo: { type: [string, 'null'] }
    SubscriptionInput:
      type: object
      required: [name, category, status, amount, billingCycle, billingAnchorOn, scope]
      properties:
        name: { type: string }
        providerName: { type: [string, 'null'] }
        planName: { type: [string, 'null'] }
        category:
          type: string
          enum: [ai_software, cloud_storage, education, entertainment, communication, fitness, news, other]
        status: { type: string, enum: [trial, active, paused, cancelled, ended] }
        decision: { type: string, enum: [keep, review, cancel_candidate] }
        amount: { $ref: '#/components/schemas/PositiveKrwAmount' }
        billingCycle: { type: string, enum: [weekly, monthly, quarterly, semiannual, yearly, custom_days] }
        customCycleDays: { type: [integer, 'null'], minimum: 1 }
        billingAnchorOn: { type: string, format: date }
        nextBillingOn: { type: [string, 'null'], format: date }
        trialEndsOn: { type: [string, 'null'], format: date }
        cancelByOn: { type: [string, 'null'], format: date }
        autoRenews: { type: boolean }
        paymentAccountId: { type: [string, 'null'], format: uuid }
        descriptorAliases: { type: array, items: { type: string } }
        reminderDaysBefore: { type: array, items: { type: integer, minimum: 0 } }
        serviceUrl: { type: [string, 'null'], format: uri }
        notes: { type: [string, 'null'] }
        lastUsedOn: { type: [string, 'null'], format: date }
        scope: { type: string, enum: [private, household] }
        householdId: { type: [string, 'null'], format: uuid }
        payerMemberId: { type: [string, 'null'], format: uuid }
        splitBasisPoints:
          type: array
          items:
            type: object
            required: [memberId, basisPoints]
            properties:
              memberId: { type: string, format: uuid }
              basisPoints: { type: integer, minimum: 0, maximum: 10000 }
    InventoryItemInput:
      type: object
      required: [name, quantity, unit, ownerKind, storageLocation]
      properties:
        name: { type: string }
        quantity: { type: number, minimum: 0 }
        unit: { type: string }
        ownerKind: { type: string, enum: [member, shared] }
        ownerMemberId: { type: [string, 'null'], format: uuid }
        storageLocation: { type: string, enum: [refrigerated, frozen, room_temperature] }
        expiresOn: { type: [string, 'null'], format: date }
        lowStockThreshold: { type: [number, 'null'], minimum: 0 }
        notes: { type: [string, 'null'] }
    SharedExpenseInput:
      type: object
      required: [payerMemberId, category, description, amount, incurredOn, splits]
      properties:
        payerMemberId: { type: string, format: uuid }
        category:
          type: string
          enum: [rent, management_fee, electricity, gas, water, internet, household_goods, shared_grocery, subscription, other]
        description: { type: string }
        amount: { $ref: '#/components/schemas/PositiveKrwAmount' }
        incurredOn: { type: string, format: date }
        linkedTransactionId: { type: [string, 'null'], format: uuid }
        splits:
          type: array
          minItems: 1
          items:
            type: object
            required: [memberId, amount]
            properties:
              memberId: { type: string, format: uuid }
              amount: { $ref: '#/components/schemas/KrwAmount' }
    Dashboard:
      type: object
      required: [month, todayLessons, tutoring, money, subscriptions, grow, household, matchSuggestions]
      properties:
        month: { type: string }
        todayLessons:
          type: array
          items: { $ref: '#/components/schemas/Lesson' }
        tutoring:
          type: object
          required: [forecast, earned, received, outstanding]
          properties:
            forecast:
              allOf:
                - { $ref: '#/components/schemas/KrwAmount' }
              description: Clearly labeled projection from active recurring schedules; never settled cash.
            earned: { $ref: '#/components/schemas/KrwAmount' }
            received: { $ref: '#/components/schemas/KrwAmount' }
            outstanding: { $ref: '#/components/schemas/KrwAmount' }
        money:
          type: object
          required: [totalBalance, settledIncome, settledExpense]
          properties:
            totalBalance: { type: integer, format: int64 }
            settledIncome: { $ref: '#/components/schemas/KrwAmount' }
            settledExpense: { $ref: '#/components/schemas/KrwAmount' }
        subscriptions: { type: object, additionalProperties: true }
        grow: { type: object, additionalProperties: true }
        household: { type: object, additionalProperties: true }
        matchSuggestions:
          type: array
          items: { type: object, additionalProperties: true }
